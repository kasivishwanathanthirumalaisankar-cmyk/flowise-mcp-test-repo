<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily To-Do App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .task-item {
            background-color: #f9fafb;
            border-left: 4px solid #3b82f6;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
        }
        .completed {
            text-decoration: line-through;
            color: #9ca3af;
            border-left-color: #6b7280;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Daily To-Do App</h1>
    
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
        <h2 class="text-xl font-semibold mb-4">Add a Task</h2>
        <form id="taskForm" class="mb-6">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
                class="w-full p-2 border rounded-md mb-2"
                required
            />
            <button
                type="submit"
                class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600"
            >
                Add Task
            </button>
        </form>
        
        <h2 class="text-xl font-semibold mb-4">Today's Tasks</h2>
        <div id="tasksList" class="mb-6 min-h-32">
            <p class="text-gray-500 text-center py-4">No tasks yet.</p>
        </div>
    </div>
    
    <script>
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const taskInput = document.getElementById('taskInput');
            const taskText = taskInput.value.trim();
            
            if (!taskText) return;
            
            try {
                const response = await fetch('http://localhost:3000/tasks', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ task: taskText })
                });
                
                if (response.ok) {
                    taskInput.value = '';
                    loadTasks();
                } else {
                    alert('Failed to add task.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while adding the task.');
            }
        });
        
        async function loadTasks() {
            try {
                const response = await fetch('http://localhost:3000/tasks');
                const tasks = await response.json();
                
                const tasksList = document.getElementById('tasksList');
                tasksList.innerHTML = '';
                
                if (tasks.length === 0) {
                    tasksList.innerHTML = '<p class="text-gray-500 text-center py-4">No tasks yet.</p>';
                    return;
                }
                
                tasks.forEach(task => {
                    const taskElement = document.createElement('div');
                    taskElement.className = `task-item ${task.completed ? 'completed' : ''}`;
                    taskElement.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span>${task.task}</span>
                            <div>
                                <button
                                    class="text-green-500 hover:text-green-700 mr-2"
                                    onclick="markTaskDone(${task.id})"
                                >
                                    Done
                                </button>
                                <button
                                    class="text-red-500 hover:text-red-700"
                                    onclick="deleteTask(${task.id})"
                                >
                                    Delete
                                </button>
                            </div>
                        </div>
                    `;
                    tasksList.appendChild(taskElement);
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        async function markTaskDone(id) {
            try {
                const response = await fetch(`http://localhost:3000/tasks/${id}/done`, {
                    method: 'PUT'
                });
                
                if (response.ok) {
                    loadTasks();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        async function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                try {
                    const response = await fetch(`http://localhost:3000/tasks/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        loadTasks();
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        }
        
        // Load tasks on page load
        loadTasks();
    </script>
</body>
</html>
